# Loopback-only test environment before a domain is available.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kmz
      POSTGRES_USER: kmz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kmz -d kmz"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    environment:
      KMZ_ENV: development
      POSTGRES_HOST: db
      POSTGRES_USER: kmz
      POSTGRES_DB: kmz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PUBLIC_BASE_URL: http://127.0.0.1:8000
      ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - '127.0.0.1:8000:8000'
    command: ["sh", "-c", "python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000 --noreload"]
    volumes:
      - photos:/app/media
    depends_on:
      db:
        condition: service_healthy
    init: true
volumes:
  database:
  photos:
