services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kmz}
      POSTGRES_USER: ${POSTGRES_USER:-kmz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      KMZ_ENV: production
      POSTGRES_HOST: db
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 45 --access-logfile - --error-logfile -"]
    volumes:
      - photos:/app/media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
  nginx:
    image: nginx:stable-alpine
    environment:
      SERVICE_HOST: ${SERVICE_HOST:?Set SERVICE_HOST}
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80'
      - '${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443'
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/proxy.conf:/etc/nginx/snippets/kmz-proxy.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - static:/app/staticfiles:ro
    depends_on:
      - app
    restart: unless-stopped
volumes:
  database:
  photos:
  static:
